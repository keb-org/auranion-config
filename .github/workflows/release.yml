name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: auranion-windows-amd64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: auranion-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: auranion-macos-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: auranion-linux-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare asset
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/auranion.exe" "${{ matrix.asset_name }}"
          else
            cp "target/${{ matrix.target }}/release/auranion" "${{ matrix.asset_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Extract Cargo version
        id: get_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d '"' -f2)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: assets/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
